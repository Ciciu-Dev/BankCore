name: BankCore
version: 0.3.0
main: me.alex.bankcore.BankCore
api-version: '26.2'
author: Alex
description: A modern banking and economy system built for Paper.

commands:
  balance:
    description: View your bank balance.
    aliases: [bal]
    usage: /balance
    permission: bankcore.balance

  pay:
    description: Send money to another player.
    usage: /pay <player> <amount>
    permission: bankcore.pay

  bank:
    description: Open your BankCore account.
    usage: /bank
    permission: bankcore.bank

  bankadmin:
    description: Manage player bank balances.
    usage: /bankadmin <set|add|remove> <player> <amount>
    permission: bankcore.admin

permissions:
  bankcore.balance:
    default: true

  bankcore.pay:
    default: true

  bankcore.bank:
    default: true

  bankcore.admin:
    description: Allows access to BankCore admin commands.
    default: op
